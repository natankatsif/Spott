[project]
name = "offline-indexation"
description = "Crawls the Annex 1 sites and builds the document corpus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.130.0",
    "httpx>=0.28.1",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "retrieval",
    "selectolax>=0.4.12",
    "sentence-transformers>=6.1.0",
    "trafilatura>=2.2.0",
]

[tool.uv.sources]
retrieval = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I", "SIM"]
