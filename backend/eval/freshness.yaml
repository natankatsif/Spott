# Freshness eval (docs/history/tasks/08): questions whose answer changed over the years.
# expect_newest: URL fragments of the newest document(s) the answer must cite (any one of them);
#                URLs, not doc_ids, because doc_ids differ between index dumps.
# expect_mention: the answer must contain one of these (case-insensitive), if given.
# forbid: statuses / conflict kinds the answer must not have.
# Run: cd backend && uv run python scripts/eval_freshness.py

- id: pug-who-ro
  question: Cine elaborează Planul urbanistic general?
  lang: ro
  expect_newest: [regulament-gs.pdf, dispozitia-366d-10.2025.pdf, dispozitia-nr.-251-d-din-02.07.2026.pdf]
  expect_mention: [ARHICON, 45/25]
  forbid: [contradiction]

