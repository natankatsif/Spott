, "l": 79.7, "t": 312.7, "r": 554.7, "b": 357.3, "page_width": 595.2, "page_height": 841.92}]}, "af214bb97fb3aabf01d3bc3eac657e6873d21160": {"text": "din Legea nr. 136 din 17.06.2016 „Privind statutul municipiului Chișinău\", art. 14 alin. (2) și art. 19 alin. (4) din Legea nr. 436-XVI din 28.12.2006 „Privind administrația publică locală\" și prevederile Legii nr. 1420 din 31.10.2002 „Cu privire la filantropie și sponsorizare\", Consiliul municipal Chișinău DECIDE:", "page": 1, "bboxes": [{"page": 1, "l": 77.1, "t": 347.8, "r": 553.1, "b": 423.6, "page_width": 595.2, "page_height": 841.92}]}, "ca8a07e9a59621dc8e9c3a92473bc73d341e1fe9": {"text": "1. Primarul General al municipiului Chișinău domnul Ion Ceban va asigura, până la data de 01.04.2020, crearea unui Consorțiu internațional și a unui Grup de lucru pentru supravegherea procesului de elaborare a Strategiei de dezvoltare a municipiului Chișinău și a Planului Urbanistic General, cu aprobarea ulterioară de Consiliul municipal Chișinău.", "page": 1, "bboxes": [{"page": 1, "l": 87.7, "t": 429.5, "r": 551.5, "b": 520.8, "page_width": 595.2, "page_height": 841.92}]}, "ff5932e8879a729d3ab13690707d868284e587bd": {"text": "2. Se pune în sarcina viceprimarului de ramură prezentarea trimestrială la Consiliul municipal Chișinău a raportului privind mersul lucrărilor de elaborare a Strategiei de dezvoltare a municipiului Chișinău și a Planului Urbanistic General.", "page": 1, "bboxes": [{"page": 1, "l": 89.2, "t": 520.3, "r": 549.9, "b": 589.7, "page_width": 595.2, "page_height": 841.92}]}, "560ab1575f0ce4b153799a6a00e10c8e2a809238": {"text": "3. Primăria municipiului Chișinău își rezervă drepturile exclusive asupra documentației, studiilor și altor acte întocmite în procesul elaborării Strategiei de Dezvoltare și Planului Urbanistic General. Documentația de urbanism, Planul Urbanistic General elaborat în baza prezentei decizii vor fi proprietatea municipiului Chișinău.", "page": 1, "bboxes": [{"page": 1, "l": 87.7, "t": 592.4, "r": 547.5, "b": 684.4, "page_width": 595.2, "page_height": 841.92}]}, "23f708a0490e90ab553887e5f25a2e1329e1dcb6": {"text": "4. Consorțiul internațional și Grupul de supraveghere vor prezenta Primarului General/Consiliului municipal Chișinău Planul de acțiuni privind elaborarea sarcinii de proiectare, Strategiei de Dezvoltare și Planului Urbanistic General.", "page": 1, "bboxes": [{"page": 1, "l": 85.2, "t": 684.2, "r": 546.6, "b": 747.3, "page_width": 595.2, "page_height": 841.92}]}, "78beff8cfe211f3e7cd07fbd480b53e12d60af83": {"text": "00023165 din 05.03.2020 din 05.03.2020", "page": 1, "bboxes": [{"page": 1, "l": 530.6, "t": 123.9, "r": 560.0, "b": 130.2, "page_width": 595.2, "page_height": 841.92}]}, "97a052df3d87918da39f35a85a18f0d418fcb65f": {"text": "DECIZIE 5. Se acceptă, în calitate de membru al Consorțiului, Asociația „Centrul de Cercetare pentru Dezvoltare Durabilă\" din România și oferta de sponsorizare a acțiunilor privind elaborarea și avizarea Planului Urbanistic General al municipiului Chișinău de către Asociația „Centrul de Cercetare pentru Dezvoltare Durabilă\" din România în valoare de 500 000 euro.", "page": 1, "bboxes": [{"page": 1, "l": 252.0, "t": 164.9, "r": 355.7, "b": 179.4, "page_width": 595.2, "page_height": 841.92}]}, "f313f6dafc193cbc027e2a8457de2f7d6e5bdd6e": {"text": "6. Domnul Ion Ceban, în calitatea sa de Primar General al municipiului Chișinău, va semna Contractul de sponsorizare, după obținerea avizelor pozitive ale Comisiei pentru construcții, arhitectură și relații funciare și Comisiei pentru buget, economie, finanțe, patrimoniu public local, agricultură și problemele suburbiilor, până la 15 martie 2020.", "page": 2, "bboxes": [{"page": 2, "l": 89.7, "t": 178.4, "r": 552.3, "b": 266.6, "page_width": 595.2, "page_height": 841.92}]}, "db9a77be1393e52e76c0b7364b664addb1b7ca44": {"text": "7. Direcția generală arhitectură, urbanism și relații funciare va furniza Consorțiului toate informațiile necesare pentru realizarea acțiunii de elaborare și avizare a Planului Urbanistic General al municipiului Chișinău.", "page": 2, "bboxes": [{"page": 2, "l": 90.5, "t": 270.7, "r": 552.2, "b": 321.9, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 89.0, "t": 323.9, "r": 551.6, "b": 393.3, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 92.0, "t": 395.7, "r": 552.0, "b": 449.0, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 88.0, "t": 449.9, "r": 554.0, "b": 484.5, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 129.2, "t": 557.9, "r": 301.3, "b": 576.7, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 130.3, "t": 596.9, "r": 280.2, "b": 608.9, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 130.3, "t": 614.8, "r": 216.3, "b": 626.2, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 412.1, "t": 562.3, "r": 516.7, "b": 574.9, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 411.4, "t": 616.8, "r": 516.7, "b": 629.5, "page_width": 595.2, "page_height": 841.92}]}, "16f13655d3dc63ea120f10f2ca3bdfa56d0437ce": {"text": "8. Direcția generală arhitectură, urbanism și relații funciare va asigura achitarea taxelor pentru avizarea documentelor/proiectelor la instituțiile naționale de specialitate, în limita alocațiilor prevăzute în bugetul municipiului Chișinău la acest capitol.", "page": 2, "bboxes": [{"page": 2, "l": 90.5, "t": 270.7, "r": 552.2, "b": 321.9, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 89.0, "t": 323.9, "r": 551.6, "b": 393.3, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 92.0, "t": 395.7, "r": 552.0, "b": 449.0, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 88.0, "t": 449.9, "r": 554.0, "b": 484.5, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 129.2, "t": 557.9, "r": 301.3, "b": 576.7, "page_width": 595.2, "page_height": 841.92}, {"page": 2, "l": 130.3, "t": 596.9, "r": 280.2, "b": 608.9, "page_width": 595.2, "page_height"
