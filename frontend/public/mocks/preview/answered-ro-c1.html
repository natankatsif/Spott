cală\", \", art.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "fdd1e0b9bc65156b849cf33fb5dc86f5085c3b30": {"text": "6 alin. (1), alin. (2) pct.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "a03fc292ba78bc59b4b5e3e872bbf391e7471210": {"text": "2) lit. d) și alin. (3) din Legea nr.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "7dfb05567e4ec02f605ffb09c2e807b9dd78705b": {"text": "136/2016 „Privind statutul municipiului Chișinău\", decizia nr.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "9ff5530246ac7aad491a4f3d0e11bd353dbf9a32": {"text": "68/1-2 din 22.03.2007 „Cu privire la aprobarea Planului urbanistic general al orașului Chișinău\", decizia nr.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "2b9616612ec65f33b91930afc827e317a9de2a53": {"text": "22/40 din 25.12.2008 „Cu privire la aprobarea Regulamentului local de urbanism\", Consiliul Municipal Chișinău DECIDE:", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 315.9, "r": 564.4, "b": 530.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "16fe73ed3a80f997b5c0d50149b4943f98456cea": {"text": "Se ia act de prevederile Caietului de sarcini (Tema-program) pentru elaborarea Planului urbanistic general al orașului Chișinău.", "page": 1, "bboxes": [{"page": 1, "l": 101.2, "t": 550.3, "r": 569.5, "b": 580.6, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "06986746570f6e40a98c175da44ec0bab98c6553": {"text": "Compania sau consorțiul de companii câștigătoare va îndeplini în mod obligatoriu prevederile stipulate în Anexă,", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 619.9, "r": 568.8, "b": 649.2, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "4b4465084b69fd92fbbe7a46d127106733c56fdd": {"text": "2. Direcția generală Direcția generală arhitectură, urbanism și relații funciare va selecta compania sau consorțiul de companii care va elabora Planul urbanistic general prin intermediul procedurii de achiziții publice.", "page": 1, "bboxes": [{"page": 1, "l": 100.8, "t": 578.3, "r": 569.5, "b": 620.9, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "b823952598e54dc796fe20bfcd88310bde78fabd": {"text": "Direcția generală arhitectură, urbanism și relații funciare va asigura obținerea avizelor și permiselor necesare.", "page": 1, "bboxes": [{"page": 1, "l": 101.6, "t": 647.4, "r": 569.5, "b": 675.3, "page_width": 595.8000000000001, "page_height": 842.3999999999999}]}, "4bb2ee9bd8d52611affeb5c9ed2024eae249a692": {"text": "5. După realizarea Planul urbanistic general, odată cu obținerea avizelor necesare, beneficiarul va înainta documentația de urbanism spre aprobare către Consiliul municipal Chișinău.", "page": 1, "bboxes": [{"page": 1, "l": 100.9, "t": 673.5, "r": 569.2, "b": 715.1, "page_width": 595.8000000000001, "page_height": 842.3999999999999}, {"page": 1, "l": 100.1, "t": 716.1, "r": 569.2, "b": 755.5, "page_width": 595.8000000000001, "page_height": 842.3999999999999}, {"page": 1, "l": 100.2, "t": 757.0, "r": 568.8, "b": 783.8, "page_width": 595.8000000000001, "page_height": 842.3999999999999}, {"page": 2, "l": 107.9, "t": 51.5, "r": 571.8, "b": 78.3, "page_width": 595.8000000000001, "page_height": 842.3999999999999}, {"page": 3, "l": 109.9, "t": 120.3, "r": 572.0, "b": 145.5, "page_width": 595.8000000000001, "page_height": 842.3999999999999}, {"page": 3, "l": 129.0, "t": 160.5, "r": 268.7, "b": 173.9, "page_width": 595.8000000000001, "page_height": 842.3999999999
