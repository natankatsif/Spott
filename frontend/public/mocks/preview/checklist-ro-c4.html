.5, "page_height": 842.2499787}]}, "6d8ae23dbaebb4786694d1f30d7a8efb86a78da8": {"text": "Toți beneficiarii de protecție temporară care au copii de vârstă școlară trebuie să înregistreze starea de înscriere a copilului lor, indiferent dacă copilul este înscris într-o școală din Republica Moldova sau continuă să studieze online într-o școală ucraineană.", "page": 1, "bboxes": [{"page": 1, "l": 42.7, "t": 239.8, "r": 552.8, "b": 324.5, "page_width": 595.5, "page_height": 842.2499787}]}, "5f64ca0c9541fc8b19ed5362d5df0c453280c4d6": {"text": "Această procedură va ajuta Ministerul Educației și Cercetării să se asigure că toți copiii de vârstă școlară sunt înscriși în învățământul formal (fie personal, fie online).", "page": 1, "bboxes": [{"page": 1, "l": 45.0, "t": 351.6, "r": 550.5, "b": 383.3, "page_width": 595.5, "page_height": 842.2499787}]}, "c24aba09c24647ba26858e2a520e719b80627340": {"text": "Dacă copilul dumneavoastră este înscris într-o școală din Republica Moldova:", "page": 1, "bboxes": [{"page": 1, "l": 24.7, "t": 407.3, "r": 562.9, "b": 437.1, "page_width": 595.5, "page_height": 842.2499787}]}, "11e04139fdb30e17744c58895105b13663cbc519": {"text": "Pasul 1: Școala va distribui un formular pentru fiecare copil tuturor părinților sau tutorilor legali. Formularul va fi disponibil în limba română, rusă și ucraineană și va conține informații de bază privind starea de înscriere a copilului.", "page": 1, "bboxes": [{"page": 1, "l": 34.9, "t": 458.9, "r": 552.8, "b": 535.1, "page_width": 595.5, "page_height": 842.2499787}]}, "e05217fb7a34ced5aab3f1a22b3a27a0bd47d2a3": {"text": "Pasul 2: Trebuie să completați și să semnați formularul (un formular per copil) și să îl transmiteți la administrația școlii.", "page": 1, "bboxes": [{"page": 1, "l": 34.9, "t": 563.9, "r": 552.8, "b": 598.1, "page_width": 595.5, "page_height": 842.2499787}]}, "5ebf5d232d50d44534da2c28121a9e1fa3d1251b": {"text": "Pasul 3: Nu sunt necesare alte acțiuni decât dacă școala solicită informații suplimentare.", "page": 1, "bboxes": [{"page": 1, "l": 34.9, "t": 626.9, "r": 552.8, "b": 661.1, "page_width": 595.5, "page_height": 842.2499787}]}, "3189e434273e63261437f07c35c1db05fc14f5b7": {"text": "Dacă copilul este înscris într-o școală din Republica Moldova, nu sunt necesare documente justificative.", "page": 1, "bboxes": [{"page": 1, "l": 83.7, "t": 679.3, "r": 472.5, "b": 710.7, "page_width": 595.5, "page_height": 842.2499787}]}, "d373ee717866069fb2162bd55308ccdfc40fb1ac": {"text": "Scanează aici pentru a accesa șablonul în limba română.", "page": 1, "bboxes": [{"page": 1, "l": 371.5, "t": 730.9, "r": 490.4, "b": 778.5, "page_width": 595.5, "page_height": 842.2499787}]}, "085f30b437be05cd55c966e4f1588a532fc92c97": {"text": "The list of Education Directorates is available at the Ministry's website at mec.gov.md. scan thw qr Formularele de înregistrare (română, rusă, ucraineană) și lista Direcțiilor de Învățământ sunt disponibile pe site-ul Ministerului în secțiunea pentru educația copiilor ucraineni: https://mec.gov.md/", "page": 1, "bboxes": [{"page": 1, "l": 16.1, "t": 729.2, "r": 457.7, "b": 787.5, "page_width": 595.5, "page_height": 842.2499787}]}, "6fb161c7bf238c80dcc5e61b3131d6a5e6565ecb": {"text": "Dacă copilul dumneavoastră studiază online într-o școală ucraineană:", "page": 2, "bboxes": [{"page": 2, "l": 24.5, "t": 14.8, "r": 576.2, "b": 66.5, "page_width": 595.5, "page_height": 842.2499787}]}, "18a9050ec0507dbc16c67197b410ed85990fc3b6": {"text": "a) Depunere online Pasul 1: Descărcați un formular pentru fiecare copil de pe site-ul Ministerului Educației și Cercetării în secțiunea pentru copiii refugiați ucraineni: https://mec.gov.md/.", "page": 2, "bboxes": [{"page": 2, "l": 28.7, "t": 88.0, "r": 163.8, "b": 102.1, "page_width": 595.5, "page_height": 842.2499787}]}, "0161eac1e639940351df22c830f3ad5064b5e3c0": {"text": "Formularul este disponibil în română, rusă și ucraineană.", "page": 2, "bboxes": [{"page": 2, "l": 33.4, "t": 126.4, "r": 567.3, "b": 216.7, "page_width": 595.5, "page_height": 842.2499787}]}, "d6c7d52fef3f4d33f542960ed9a7f9a00480c423": {"text": "Include informații de bază despre starea de înscriere a copilului dvs., cum ar fi adresa dumneavoastră în Republica Moldova, adresa școlii în Ucraina, nota clasei, printre alte detalii.", "page": 2, "bboxes": [{"page": 2, "l": 33.4, "t": 126.4, "r": 567.3, "b": 216.7, "page_width": 595.5, "page_height": 842.2499787}]}, "546b7e9b50e27f5ed1e84798c2bf389aca80516c": {"text": "Pasul 2: Completează și semnează un formular separat pentru fiecare copil înscris în sistemul de învățământ ucrainean.", "page": 2, "bboxes": [{"page": 2, "l": 33.4, "t": 223.9, "r": 567.3, "b": 255.7, "page_width": 595.5, "page_height": 842.2499787}]}, "b7ac4e96186dc5d7773c8c92bb7738a3d835240a": {"text": "Pasul 3: Adunați toate documentele justificative necesare. Asigurați-vă că fiecare document este corect și complet.", "page": 2, "bboxes": [{"page": 2, "l": 33.4, "t": 262.9, "r": 567.3, "b": 294.7, "page_width": 595.5, "page_height": 842.2499787}]}, "c355095bcd82c8822c1bf0f273dc8afb22d8bb9d": {"text": "Pasul 4: Trimiteți formularul completat și semnat împreună cu documentele justificative prin e-mail către Direcția Educație din districtul dumneavoastră de reședință. Adresa de contact o găsiți în lista punctelor focale ale Direcției Educaționale, disponibilă pe site-ul Ministerului în secțiunea pentru copiii refugiați ucraineni.", "page": 2, "bboxes": [{"page": 2, "l": 33.4, "t": 302.0, "r": 567.3, "b": 372.8, "page_width": 595.5, "page_height": 842.2499787}]}, "7880ae0a0018b3c1754480e19726b49db844cc99": {"text": "b) Depunerea în persoană Pasul 1: Vizitați Direcția Educație din districtul dvs. de reședință și aduceți toate documentele justificative.", "page": 2, "bboxes": [{"page": 2, "l": 28.7, "t": 404.2, "r": 211.1, "b": 418.3, "page_width": 595.5, "page_height": 842.2499787}]}, "7718fac436cc8a07da04a02ce30c9e9965781893": {"text": "Pasul 2: Completați și semnați un formular pentru fiecare copil. Trebuie să completați un formular separat pentru fiecare copil înscris în sistemul de învățământ ucrainean.", "page": 2, "bboxes": [{"page": 2, "l": 27.8, "t": 478.0, "r": 567.3, "b": 509.8, "page_width": 595.5, "page_height": 842.2499787}]}, "83bd40c471cce84547e8108949422e8f15e6e271": {"text": "Pasul 3: Dacă nu puteți completa singur formularul, punctul focal al Direcției Educație vă va oferi sprijin.", "page": 2, "bboxes": [{"page": 2, "l": 27.8, "t": 517.0, "r": 567.3, "b": 548.8, "page_width": 595.5, "page_height": 842.2499787}]}, "4c4826f941d4a95bf4d94cf90407f284849de8b3": {"text": "Pasul 4: Asigurați-vă că fiecare formular este completat și semnat corect înainte de a fi trimis la punctul focal al Direcției Educației.", "page": 2, "bboxes": [{"page": 2, "l": 27.8, "t": 556.0, "r": 567.3, "b": 587.8, "page_width": 595.5, "page_height": 842.2499787}]}, "3c3d995b8fb83a246c7bcb73e07cb2cef9b91a7f": {"text": "c) De ce documente justificative aveți nevoie pentru copiii care învață online?", "page": 2, "bboxes": [{"page": 2, "l": 28.7, "t": 600.2, "r": 577.8, "b": 614.2, "page_width": 595.5, "page_height": 842.2499787}]}, "01d767df908945800f2f0f87242b0477738ac04a": {"text": "Scrisoare de confirmare de la instituția de învățământ.", "page": 2, "bboxes": [{"page": 2, "l": 37.8, "t": 627.4, "r": 367.4, "b": 639.6, "page_width": 595.5, "page_height": 842.2499787}]}, "73d4d0f5a96f6d203e2ecc25c49f0294b792c3a7": {"text": "sau E-mail de confirmare de la administrația școlii din țara de înscriere.", "page": 2, "bboxes": [{"page": 2, "l": 191.9, "t": 646.9, "r": 212.7, "b": 659.1, "page_width": 595.5, "page_height": 842.2499787}]}, "364d091f43504d21c4300e958c471f69bcc093b7": {"text": "sau ID de student sau certificat digital de înscriere.", "page": 2, "bboxes": [{"page": 2, "l": 191.9, "t": 646.9, "r": 212.7, "b": 659.1, "page_width": 595.5, "page_height": 842.2499787}]}, "59788c73d7253bb973f6bf68f471dd3d25c25e2d": {"text": "Formularele de înregistrare (română, rusă, ucraineană) și lista Direcțiilor de Învățământ sunt disponibile pe site-ul Ministerului în secțiunea pentru educația copiilor ucraineni: https://mec.gov.md/", "page": 2, "bboxes": [{"page": 2, "l": 27.8, "t": 729.3, "r": 330.0, "b": 786.8, "page_width": 595.5, "page_height": 842.2499787}]}, "4e10dbfdd9c305837eaf2519128ad34775acd7ab": {"text": "Scanează aici pentru a accesa șablonul în limba română.", "page": 2, "bboxes": [{"page": 2, "l": 379.5, "t": 727.0, "r": 476.9, "b": 792.6, "page_width": 595.5, "page_height": 842.2499787}]}}, "file_url": "files/dc597e7571c3916c5d91fbd55d7987f7a576b344d5a15dcecd3cd5e72e9ea7c1.pdf", "page_sizes": [{"n": 1, "width": 595.5, "height": 842.2499787}, {"n": 2, "width": 595.5, "height": 842.2499787}], "first_page": 1}</script><script type="module" nonce="mao83QeDZ5iYnGaZ8lzDTg" src="static/pdf-viewer.js"></script></body></html>
