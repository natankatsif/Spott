[project]
name = "retrieval"
version = "0.1.0"
description = "Municipal assistant retrieval engine: DB, embeddings, hybrid search, rerank"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
qsearch = "retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# PLW1514 (open() without encoding) is a preview rule; only explicitly listed preview rules run.
preview = true
explicit-preview-rules = true
select = ["F", "E9", "B", "UP", "I", "SIM", "PLW1514"]
