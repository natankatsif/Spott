# Сайты из Annex 1, по одной записи на домен.
# Поля по умолчанию берутся из [defaults]; любое можно переопределить у сайта.
#   start_urls    — откуда начинать обход в ширину (глубина 0)
#   max_depth     — сколько кликов от стартовых страниц
#   max_pages     — лимит HTML-страниц на сайт
#   delay         — пауза между запросами к сайту, сек
#   ignore_robots — обходить, даже если robots.txt запрещает

[defaults]
max_depth = 4
max_pages = 2000
delay = 0.5
ignore_robots = false

# --- Transparency & Municipal Projects ---
[[site]]
id = "chisinau.md"
category = "transparency"
start_urls = [
  "https://www.chisinau.md/ro/transparenta",
  "https://www.chisinau.md/ro",
  "https://www.chisinau.md/ru",
]
# robots.txt: "Disallow: /". Включить ignore_robots только после согласования с ментором.

[[site]]
id = "suburbii.chisinau.md"
category = "transparency"
start_urls = ["https://suburbii.chisinau.md/"]

[[site]]
