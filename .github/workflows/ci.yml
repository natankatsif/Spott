# Lint + unit tests on Linux and Windows. Windows runs without PYTHONUTF8 on purpose:
# the default cp1252 encoding is what a tester's PC has, so encoding bugs show up here first.
# Python 3.14 as in the Docker image; on Linux also 3.12, the oldest requires-python allows (for Intel Macs, see
# backend/pyproject.toml), so that code which only works on 3.14 fails here and not on a tester's Mac.
# On Linux the tests that need Postgres (the registry, each test in a schema of its own) run against a container;
# Windows runners can't run it, there those tests are skipped.
# The frontend job checks its API types and mocks against backend/openapi.json, lints, type-checks and builds the app.
#
# A push to main with green tests updates the server: it pulls and restarts what changed (docker/deploy.sh).
# The frontend is deployed by Vercel itself (project Root Directory = frontend).
# Deploy needs these repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server address
#   DEPLOY_USER     user that can run docker there
#   DEPLOY_SSH_KEY  private key whose public half is in that user's ~/.ssh/authorized_keys
#   DEPLOY_PATH     where the repo is cloned on the server, e.g. /opt/Spott
# Without DEPLOY_HOST the deploy job is skipped.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install (lockfile must be up to date)
        run: uv sync --all-extras --all-groups --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Import layers (core <- api, core <- ingest; api and ingest independent)
        run: uv run lint-imports
      - name: API contract (openapi.json matches the code)
        run: uv run python scripts/export_openapi.py --check
      - name: Postgres for the registry tests (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=qwerty -e POSTGRES_PASSWORD=qwerty_secret \
            -e POSTGRES_DB=qwerty pgvector/pgvector:pg17
          timeout 90 sh -c 'until docker exec pg pg_isready -h 127.0.0.1 -U qwerty -d qwerty; do sleep 1; done'
          echo "SPOTT_TEST_PG=require" >> "$GITHUB_ENV"
      - name: Unit tests (no index)
        run: uv run pytest -q -m "not db"
      - name: Doctor (CI mode)
        run: uv run python -m spott.ingest.tools.doctor --ci
      - name: Commands start
        run: |
          uv run qsearch --help
          uv run qsearch --report
          uv run python -m spott.ingest.tools.pipeline update --dry-run
          uv run python -m spott.ingest.tools.index_io --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile must be up to date)
        run: npm ci
      - name: API types match backend/openapi.json
        run: npm run api:check
      - name: Mocks match backend/openapi.json
        run: npm run check:mocks
      - name: ESLint
        run: npm run lint
      - name: Type check + production build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Secrets set?
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST not set: skipping deploy"; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy over SSH
        if: steps.check.outputs.run == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: sh "${{ secrets.DEPLOY_PATH }}/docker/deploy.sh"
