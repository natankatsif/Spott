services:
  db:
    image: pgvector/pgvector:pg17
    container_name: qwerty-pgvector
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qwerty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty_secret}
      POSTGRES_DB: ${POSTGRES_DB:-qwerty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qwerty} -d ${POSTGRES_DB:-qwerty}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
